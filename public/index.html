<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unifor Grupos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Parse SDK -->
    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar (igual ao anterior) -->
            <div class="col-md-4 col-lg-3 p-0 sidebar">
                <div class="header d-flex justify-content-between align-items-center">
                    <h5 class="m-0">Grupos</h5>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" id="btnAddGroup">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-three-dots-vertical"></i>
                        </button>
                    </div>
                </div>
                
                <ul class="nav nav-tabs px-3">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Participando</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Navegar</a>
                    </li>
                </ul>
                
                <div class="search-box">
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0" placeholder="Pesquisar" id="searchGroups">
                    </div>
                </div>
                
                <div class="chat-list" id="chat-list">
                    <input type="hidden" id="chat_select"/>   
                </div>
            </div>
            
            <!-- Área de Chat -->
            <div class="col-md-8 col-lg-9 p-0 d-flex flex-column" style="height: 100vh;">
                <!-- Cabeçalho do Chat -->
                <div class="chat-header d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-arrow-left me-3 d-md-none"></i>
                        <div>
                            <h6 class="mb-0" id="titulo_grupo">Selecione um grupo</h6>
                            <small class="text-muted" id="participantes_grupo"></small>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-search"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary ms-2">
                            <i class="bi bi-three-dots-vertical"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Área de Mensagens -->
                <div class="messages-container d-flex flex-column" id="area_msg"></div>
                
                <!-- Campo de entrada de mensagem -->
                <div class="message-input d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-secondary me-2">
                        <i class="bi bi-emoji-smile"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary me-2">
                        <i class="bi bi-paperclip"></i>
                    </button>
                    <input type="text" class="form-control rounded-pill me-2" placeholder="Digite uma mensagem" id="messageInput">
                    <button class="btn btn-primary rounded-circle" id="sendButton">
                        <i class="bi bi-send"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para criar novo grupo -->
    <div class="modal fade" id="newGroupModal" tabindex="-1" aria-labelledby="newGroupModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newGroupModalLabel">Criar Novo Grupo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="groupName" class="form-label">Nome do Grupo</label>
                        <input type="text" class="form-control" id="groupName" placeholder="Ex: Grupo de Programação em Nuvem">
                    </div>
                    <div class="mb-3">
                        <label for="groupDescription" class="form-label">Descrição (opcional)</label>
                        <textarea class="form-control" id="groupDescription" rows="3" placeholder="Descreva o propósito do grupo"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="createGroupBtn">Criar Grupo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para login/cadastro -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Entrar no Chat</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nome de Usuário</label>
                        <input type="text" class="form-control" id="username" placeholder="Seu nome de usuário">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" placeholder="Sua senha">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="registerBtn">Cadastrar</button>
                    <button type="button" class="btn btn-secondary" id="loginBtn">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status de conexão -->
    <div class="connection-status" id="connectionStatus">
        <span class="badge bg-success">Conectado</span>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
